<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>Gotilo AI — Hyperlocal Assistant</title>
<meta name="theme-color" content="#F6F2EC"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#F6F2EC;--bg-subtle:#EFEAE2;--card:#FFFFFF;--card-alt:#FAF7F2;
  --text-1:#181614;--text-2:#5E5A54;--text-3:#9E988F;
  --accent:#E8590C;--accent-soft:#FFF2E8;--accent-deep:#C94A05;
  --green:#15803D;--green-bg:#EDFBF1;--blue:#1D4ED8;--blue-bg:#EFF6FF;
  --red:#B91C1C;--red-bg:#FEF2F2;--border:#E7E1D8;--border-light:#F0EBE3;
  --sh-sm:0 2px 8px rgba(24,22,20,0.04);--sh-md:0 6px 20px rgba(24,22,20,0.06);
  --radius-sm:10px;--radius-md:16px;--radius-lg:22px;--radius-full:9999px;
  --font:'Plus Jakarta Sans','Noto Sans Gujarati',-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{min-height:100%;width:100%;margin:0;padding:0;font-family:var(--font);background:var(--bg);color:var(--text-1);-webkit-font-smoothing:antialiased;}
.app{width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,0.06);}
@media(max-width:600px){.app{max-width:100%;box-shadow:none;}}

/* Chat Header */
.chat-header{
  background:var(--card);padding:10px 14px;border-bottom:1px solid var(--border-light);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:30;
}
.ch-left{display:flex;align-items:center;gap:10px;}
.back-btn{
  width:36px;height:36px;border-radius:50%;background:var(--bg);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-1);transition:all 0.15s;
}
.back-btn:active{transform:scale(0.92);background:var(--border);}
.ch-avatar{
  width:38px;height:38px;border-radius:12px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-weight:800;font-size:18px;box-shadow:0 2px 10px rgba(232,89,12,0.25);
}
.ch-name{font-size:15px;font-weight:800;color:var(--text-1);line-height:1.1;}
.ch-sub{font-size:11px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:4px;margin-top:2px;}
.ch-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:livePulse 1.5s infinite;}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(1.2);}}
.header-actions{display:flex;align-items:center;gap:6px;}
.ai-badge{
  background:var(--green-bg);border:1px solid rgba(21,128,61,0.2);padding:4px 8px;
  border-radius:var(--radius-full);font-size:11px;font-weight:700;color:var(--green);
  display:flex;align-items:center;gap:4px;cursor:pointer;
}
.clear-btn{
  width:32px;height:32px;border-radius:50%;background:var(--bg);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-3);font-size:14px;
}

/* Quick Scenarios Bar */
.scenario-bar{
  background:var(--card);border-bottom:1px solid var(--border-light);
  padding:8px 0;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-left:14px;
  flex-shrink:0;
}
.scenario-bar::-webkit-scrollbar{display:none;}
.s-chip{
  border-radius:var(--radius-full);padding:6px 12px;font-size:12px;font-weight:700;
  white-space:nowrap;cursor:pointer;flex-shrink:0;transition:all 0.15s;
  border:1px solid var(--border);background:var(--bg);color:var(--text-2);
}
.s-chip.active{background:var(--text-1);color:#fff;border-color:var(--text-1);}
.s-chip:not(.active):active{background:var(--accent-soft);color:var(--accent);}

/* Chat Area */
.chat-area{
  flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:14px 14px 20px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none;
}
.chat-area::-webkit-scrollbar{display:none;}
.date-sep{text-align:center;margin:4px 0 8px;font-size:11px;font-weight:600;color:var(--text-3);}

.msg-row-user{display:flex;justify-content:flex-end;margin-bottom:4px;}
.bubble-user{
  background:var(--text-1);color:#fff;border-radius:18px 18px 4px 18px;
  padding:10px 14px;max-width:82%;font-size:14px;line-height:1.4;font-weight:500;
  box-shadow:var(--sh-sm);word-wrap:break-word;
}
.msg-time-user{font-size:10px;color:var(--text-3);text-align:right;margin-top:3px;}

.msg-row-g{display:flex;align-items:flex-end;gap:8px;margin-bottom:4px;}
.g-av{
  width:28px;height:28px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;flex-shrink:0;
}
.bubble-g{
  background:var(--card);color:var(--text-1);border-radius:18px 18px 18px 4px;
  padding:11px 14px;max-width:84%;font-size:14px;line-height:1.45;
  border:1px solid var(--border);box-shadow:var(--sh-sm);font-weight:500;
  word-wrap:break-word;
}
.bubble-g strong, .bubble-g b{font-weight:700;color:var(--text-1);}

.typing-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:4px;}
.typing-bubble{
  background:var(--card);border-radius:18px 18px 18px 4px;
  padding:10px 14px;border:1px solid var(--border);box-shadow:var(--sh-sm);
  display:flex;gap:5px;align-items:center;
}
.td{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:tdBounce 1.3s infinite;}
.td:nth-child(2){animation-delay:.2s;}
.td:nth-child(3){animation-delay:.4s;}
@keyframes tdBounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}

/* Results Cards */
.chat-cards{display:flex;flex-direction:column;gap:9px;margin:4px 0 6px 36px;}
.ccard{
  background:var(--card);border-radius:16px;padding:12px 13px;
  border:1px solid var(--border);box-shadow:var(--sh-sm);cursor:pointer;
  transition:transform 0.15s ease;
}
.ccard:active{transform:scale(0.98);}
.cc-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.cc-av{
  width:42px;height:42px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:20px;flex-shrink:0;
}
.cc-av.blue{background:#E0F2FE;}.cc-av.green{background:#DCFCE7;}
.cc-av.peach{background:#FFEDD5;}.cc-av.purple{background:#F3E8FF;}
.cc-info{flex:1;min-width:0;}
.cc-name{font-size:13.5px;font-weight:800;color:var(--text-1);margin-bottom:2px;}
.cc-sub{font-size:12px;color:var(--text-2);margin-bottom:4px;}
.cc-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;}
.cc-avail{font-size:10px;font-weight:700;color:var(--green);background:var(--green-bg);border-radius:var(--radius-full);padding:2px 7px;}
.cc-price{font-size:12px;font-weight:700;color:var(--accent);margin-top:2px;}
.cc-btns{display:flex;gap:7px;margin-top:8px;}
.cc-btn-call{
  flex:1;padding:7px 0;text-align:center;border:1px solid var(--border);
  border-radius:9px;font-size:12px;font-weight:700;color:var(--text-1);
  background:var(--bg);cursor:pointer;
}
.cc-btn-book{
  flex:1;padding:7px 0;text-align:center;background:var(--accent);
  border:none;border-radius:9px;font-size:12px;font-weight:700;color:#fff;
  cursor:pointer;
}

.quick-chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px 36px;}
.qchip{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-full);
  padding:6px 12px;font-size:11.5px;font-weight:700;color:var(--text-1);cursor:pointer;
  box-shadow:var(--sh-sm);transition:all 0.15s;
}
.qchip:active{background:var(--accent);color:#fff;border-color:var(--accent);}

/* Input Bar */
.chat-input-bar{
  background:var(--card);border-top:1px solid var(--border-light);
  padding:10px 14px 18px;display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.input-wrap-chat{
  flex:1;background:var(--bg);border:1.5px solid var(--border);
  border-radius:20px;padding:7px 12px;display:flex;align-items:center;gap:8px;
  transition:all 0.2s;
}
.input-wrap-chat:focus-within{border-color:var(--accent);background:#fff;}
.ci-field{
  flex:1;font-family:inherit;font-size:14px;color:var(--text-1);
  background:transparent;border:none;outline:none;font-weight:500;
}
.ci-field::placeholder{color:var(--text-3);font-weight:400;}
.ci-mic{color:var(--text-2);cursor:pointer;transition:all 0.15s;flex-shrink:0;display:flex;align-items:center;}
.ci-mic.recording{color:var(--accent);animation:livePulse 1s infinite;}
.ci-mic:active{transform:scale(0.92);color:var(--accent);}
.send-btn-chat{
  width:40px;height:40px;border-radius:13px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:#fff;flex-shrink:0;box-shadow:0 3px 10px rgba(232,89,12,0.3);border:none;
}
.send-btn-chat:active{background:var(--accent-deep);transform:scale(0.92);}

/* AI Key Modal */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(24,22,20,0.5);
  backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-end;justify-content:center;
}
.modal-overlay.active{display:flex;}
.modal-sheet{
  width:100%;max-width:480px;background:var(--card);border-radius:24px 24px 0 0;
  padding:20px 20px 30px;
}
.sheet-title{font-size:17px;font-weight:800;color:var(--text-1);margin-bottom:4px;}
.sheet-sub{font-size:12.5px;color:var(--text-2);margin-bottom:14px;}
.api-input{
  width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;
  padding:10px 12px;font-family:inherit;font-size:13px;color:var(--text-1);outline:none;margin-bottom:12px;
}
.sheet-btn{
  width:100%;padding:12px;background:var(--accent);border:none;border-radius:12px;
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;
}

.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);
  background:var(--text-1);color:#fff;padding:10px 18px;border-radius:var(--radius-full);
  font-size:13px;font-weight:700;z-index:200;opacity:0;transition:all 0.3s;pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="chat-header">
    <div class="ch-left">
      <div class="back-btn" onclick="window.location.href='index.html'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <div class="ch-avatar">G</div>
      <div>
        <div class="ch-name">Gotilo AI &middot; ગોતીઢો</div>
        <div class="ch-sub"><span class="ch-dot"></span>Online &middot; Gemini Powered</div>
      </div>
    </div>
    <div class="header-actions">
      <div class="ai-badge" onclick="openApiKeyModal()">
        <span>⚡ Gemini Active</span>
      </div>
      <div class="clear-btn" onclick="clearChatHistory()" title="Clear Chat">🗑️</div>
    </div>
  </div>

  <!-- Quick Scenarios -->
  <div class="scenario-bar">
    <div class="s-chip" onclick="handleChipScenario('sweeper', this)">🧹 Sweeper &amp; Maid</div>
    <div class="s-chip" onclick="handleChipScenario('plumber', this)">🔧 Plumber</div>
    <div class="s-chip" onclick="handleChipScenario('dairy', this)">🥛 Milk &amp; Dairy</div>
    <div class="s-chip" onclick="handleChipScenario('ac', this)">❄️ AC Repair</div>
    <div class="s-chip" onclick="handleChipScenario('xerox', this)">📄 Print / Xerox</div>
    <div class="s-chip" onclick="handleChipScenario('puncture', this)">🚲 Puncture</div>
    <div class="s-chip" onclick="handleChipScenario('grocery', this)">🌾 Kirana</div>
  </div>

  <!-- Chat Content -->
  <div class="chat-area" id="chatArea"></div>

  <!-- Input Bar -->
  <div class="chat-input-bar">
    <div class="input-wrap-chat">
      <div class="ci-mic" id="micBtn" onclick="toggleVoiceRecognition()" title="Speak in Gujarati, Hindi or English">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="1" width="6" height="14" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </div>
      <input id="chatInput" class="ci-field" type="text" placeholder="Tell Gotilo what you need..." autocomplete="off"/>
    </div>
    <button class="send-btn-chat" onclick="handleSend()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

</div>

<!-- AI Key Modal -->
<div id="aiModal" class="modal-overlay" onclick="closeAiModal(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="sheet-title">Google Gemini AI Settings ⚡</div>
    <div class="sheet-sub">
      Your active Gemini API key is configured. You can update or replace it anytime:
    </div>
    <input id="apiKeyInput" class="api-input" type="password" placeholder="API Key (starts with AQ... or AIzaSy...)"/>
    <button class="sheet-btn" onclick="saveApiKey()">Save &amp; Update Key</button>
  </div>
</div>

<div id="toast" class="toast">Action</div>

<script>
const area = document.getElementById('chatArea');
const inp = document.getElementById('chatInput');

// ── Verified Gemini API Configuration ──────────────────────────
const DEFAULT_GEMINI_KEY = "";
const SYSTEM_INSTRUCTION = `You are Gotilo (ગોતીઢો), Ahmedabad's friendly and ultra-helpful hyperlocal city AI assistant.
Brand motto: "બસ કહો, ગોતીઢો." (Just tell us, we will find it).
Context: You help residents in Ahmedabad (Satellite, Vastrapur, Bodakdev, Prahlad Nagar, Navrangpura, SG Highway, Bopal) find daily essentials (Milk/Dairy, Kirana, Subji, Xerox), home repairs (Plumber, Electrician, AC repair, Locksmith, Puncture), and skilled workers (Sweepers, Maids, Tailors, Tutors).
Guidelines:
1. Speak warmly and naturally in the user's language (English, Gujarati/Gujlish, or Hindi).
2. Answer in 2 short, direct, friendly sentences. Mention you found verified nearby local providers.
3. Never use markdown asterisks (**) or bullet lists.
4. At the very end of your response, you can optionally include 2-3 quick follow-up chips like: [CHIPS: Call now | Compare rates | Send today]`;

let chatHistory = [];

// ── Local Database & Knowledge Base ───────────────────────────
const KNOWLEDGE = {
  sweeper: {
    cards: [
      {av:'🧹', avClass:'peach', name:'Geeta Ben Home Cleaning', sub:'Daily sweeping, mopping & dusting', rat:'4.9 (142)', dist:'0.5 km', price:'₹150 / day or ₹2500 / mo'},
      {av:'✨', avClass:'blue', name:'Suresh Deep Clean & Sweepers', sub:'Deep house clean, bathroom & balcony', rat:'4.8 (89)', dist:'1.1 km', price:'From ₹399 / visit'},
      {av:'🧼', avClass:'green', name:'UrbanCare Maid & Safai Service', sub:'Cook & House maid verified', rat:'4.7 (210)', dist:'1.4 km', price:'From ₹200'}
    ],
    chips: ["⚡ Send Today", "📅 Monthly Maid", "📞 Call Geeta Ben"]
  },
  plumber: {
    cards: [
      {av:'🔧', avClass:'blue', name:'Rajesh Plumbing Works', sub:'Tap leak, flush & pipe repairs · 6 yrs exp', rat:'4.8 (312)', dist:'0.6 km', price:'From ₹199'},
      {av:'🚰', avClass:'green', name:'Suresh Kumar Plumber', sub:'Bathroom fitting & RO pipeline · 4 yrs', rat:'4.6 (120)', dist:'1.2 km', price:'From ₹149'}
    ],
    chips: ["⚡ Right Now", "📅 Later Today", "📞 Call Rajesh"]
  },
  dairy: {
    cards: [
      {av:'🥛', avClass:'peach', name:'Amul Daily Parlour', sub:'Amul Gold ₹66/L · Dahi ₹35/500g · Chaas in stock', rat:'4.9 (510)', dist:'0.3 km', price:'MRP · Free drop ₹150+'},
      {av:'🍞', avClass:'blue', name:'Baker Hub & Dairy', sub:'Fresh Milk, Toast & Bread', rat:'4.7 (180)', dist:'0.6 km', price:'MRP'}
    ],
    chips: ["🛵 Home Delivery", "🏃 Self Pickup", "📞 Call Parlour"]
  },
  ac: {
    cards: [
      {av:'❄️', avClass:'blue', name:'Amit Cooling & AC Care', sub:'Filter clean, gas filling & leakage fix · 5 yrs', rat:'4.7 (189)', dist:'1.8 km', price:'From ₹349'},
      {av:'🛠️', avClass:'green', name:'CoolCare Appliances', sub:'All AC brands & inverter repair', rat:'4.8 (95)', dist:'2.2 km', price:'From ₹299'}
    ],
    chips: ["⚡ Today Booking", "❄️ Gas Top-up", "📞 Call Technician"]
  },
  xerox: {
    cards: [
      {av:'🖨️', avClass:'blue', name:'Patel Xerox & Printout', sub:'Color print, B&W ₹2/pg, Spiral binding', rat:'4.8 (340)', dist:'0.4 km', price:'From ₹2/page'},
      {av:'✏️', avClass:'peach', name:'City Books & Stationery', sub:'Pens, notebooks, files & print', rat:'4.6 (110)', dist:'0.8 km', price:'Open now'}
    ],
    chips: ["🖨️ WhatsApp PDF", "📍 Get Directions", "📞 Call Shop"]
  },
  puncture: {
    cards: [
      {av:'🛵', avClass:'peach', name:'Doorstep Puncture Express', sub:'Tubeless & tube puncture doorstep', rat:'4.9 (230)', dist:'0.7 km', price:'From ₹99'},
      {av:'🔧', avClass:'blue', name:'Kailash Auto Garage', sub:'Bike service & tyre repair', rat:'4.7 (88)', dist:'1.2 km', price:'From ₹80'}
    ],
    chips: ["⚡ Send to my location", "📞 Call Mechanic", "💬 WhatsApp"]
  },
  grocery: {
    cards: [
      {av:'🛒', avClass:'peach', name:'Shree Krishna Kirana', sub:'Wheat Atta ₹55/kg, Besan ₹80/kg, Rice & Oil', rat:'4.6 (247)', dist:'0.7 km', price:'Free drop ₹300+'},
      {av:'🌾', avClass:'green', name:'Jai Ambe Provisions', sub:'All groceries & spices', rat:'4.8 (115)', dist:'1.2 km', price:'Fast delivery'}
    ],
    chips: ["🛵 Free Delivery", "🛒 Order on WhatsApp", "📞 Call Store"]
  }
};

function matchCategory(text){
  const q = text.toLowerCase();
  if(q.includes('sweep') || q.includes('clean') || q.includes('maid') || q.includes('safai') || q.includes('kamvali') || q.includes('કામવાળા') || q.includes('સફાઈ') || q.includes('housekeeping')) return KNOWLEDGE.sweeper;
  if(q.includes('plumb') || q.includes('tap') || q.includes('leak') || q.includes('pipe') || q.includes('flush') || q.includes('નળ') || q.includes('લીકેજ')) return KNOWLEDGE.plumber;
  if(q.includes('milk') || q.includes('dairy') || q.includes('dahi') || q.includes('curd') || q.includes('chaas') || q.includes('paneer') || q.includes('amul') || q.includes('દૂધ') || q.includes('દહીં')) return KNOWLEDGE.dairy;
  if(q.includes('ac') || q.includes('cool') || q.includes('fridge') || q.includes('gas') || q.includes('refrigerat') || q.includes('એસી')) return KNOWLEDGE.ac;
  if(q.includes('print') || q.includes('xerox') || q.includes('station') || q.includes('pencil') || q.includes('pen') || q.includes('spiral') || q.includes('ઝેરોક્ષ')) return KNOWLEDGE.xerox;
  if(q.includes('punct') || q.includes('tyre') || q.includes('tire') || q.includes('bike') || q.includes('scooter') || q.includes('mechanic') || q.includes('પંચર')) return KNOWLEDGE.puncture;
  if(q.includes('atta') || q.includes('besan') || q.includes('ration') || q.includes('kirana') || q.includes('grocery') || q.includes('subji') || q.includes('veg') || q.includes('કરિયાણું')) return KNOWLEDGE.grocery;

  return {
    cards: [
      {av:'📍', avClass:'blue', name:`Satellite Verified ${escapeHtml(text.slice(0,24))} Expert`, sub:'Local verified provider · 5 yrs exp', rat:'4.8 (98)', dist:'0.8 km', price:'Direct rates'},
      {av:'⭐', avClass:'peach', name:`Ahmedabad Quick ${escapeHtml(text.slice(0,20))} Service`, sub:'Doorstep & store visit available', rat:'4.7 (64)', dist:'1.5 km', price:'Best local price'}
    ],
    chips: ["⚡ Request Callback", "📍 Get Location", "💬 Chat Provider"]
  };
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ── Multi-Model Gemini Engine ──────────────────────────────────
async function queryGemini(userText){
  const apiKey = localStorage.getItem('gotilo_ai_key') || DEFAULT_GEMINI_KEY;
  const models = ['gemini-3.6-flash', 'gemini-3.7-flash', 'gemini-flash-latest', 'gemini-2.5-flash'];

  // Add to conversation history
  chatHistory.push({ role: 'user', parts: [{ text: userText }] });

  for(const model of models){
    try{
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
      const payload = {
        systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
        contents: chatHistory
      };

      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const json = await resp.json();
      if(json.candidates && json.candidates[0].content && json.candidates[0].content.parts[0].text){
        const reply = json.candidates[0].content.parts[0].text.trim();
        // Save model reply in history
        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
        return reply;
      }
    }catch(e){
      console.warn(`Model ${model} attempt failed:`, e);
    }
  }
  return null;
}

// ── Rendering Functions ────────────────────────────────────────
function addUserBubble(text){
  const row = document.createElement('div');
  row.className = 'msg-row-user';
  row.innerHTML = `<div><div class="bubble-user">${escapeHtml(text)}</div><div class="msg-time-user">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div>`;
  area.appendChild(row);
  area.scrollTo({top:area.scrollHeight, behavior:'smooth'});
}

function addGotiloBubble(text){
  let cleanText = text;
  let customChips = [];
  const chipMatch = text.match(/\[CHIPS:\s*(.*?)\]/i);
  if(chipMatch){
    cleanText = text.replace(chipMatch[0], '').trim();
    customChips = chipMatch[1].split('|').map(s=>s.trim()).filter(Boolean);
  }

  cleanText = cleanText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

  const row = document.createElement('div');
  row.className = 'msg-row-g';
  row.innerHTML = `<div class="g-av">G</div><div class="bubble-g">${cleanText}</div>`;
  area.appendChild(row);
  area.scrollTo({top:area.scrollHeight, behavior:'smooth'});

  return customChips;
}

function showTyping(){
  const row = document.createElement('div');
  row.className = 'typing-row';
  row.id = 'typingIndicator';
  row.innerHTML = `<div class="g-av">G</div><div class="typing-bubble"><div class="td"></div><div class="td"></div><div class="td"></div></div>`;
  area.appendChild(row);
  area.scrollTo({top:area.scrollHeight, behavior:'smooth'});
}

function hideTyping(){
  const t = document.getElementById('typingIndicator');
  if(t) t.remove();
}

function renderCards(cards){
  const wrap = document.createElement('div');
  wrap.className = 'chat-cards';
  cards.forEach(c => {
    wrap.innerHTML += `
      <div class="ccard" onclick="window.location.href='professional.html'">
        <div class="cc-top">
          <div class="cc-av ${c.avClass}">${c.av}</div>
          <div class="cc-info">
            <div class="cc-name">${c.name}</div>
            <div class="cc-sub">${c.sub}</div>
            <div class="cc-meta">
              <span>★ ${c.rat}</span> &middot; <span>${c.dist}</span> &middot;
              <span class="cc-avail">Available</span>
            </div>
            <div class="cc-price">${c.price}</div>
          </div>
        </div>
        <div class="cc-btns">
          <div class="cc-btn-call" onclick="event.stopPropagation();showToast('Calling: +91 98980 XXXXX')">📞 Call</div>
          <div class="cc-btn-book" onclick="event.stopPropagation();window.location.href='professional.html'">⚡ Request</div>
        </div>
      </div>
    `;
  });
  area.appendChild(wrap);
  area.scrollTo({top:area.scrollHeight, behavior:'smooth'});
}

function renderChips(chips){
  const wrap = document.createElement('div');
  wrap.className = 'quick-chips';
  chips.forEach(ch => {
    const chip = document.createElement('div');
    chip.className = 'qchip';
    chip.textContent = ch;
    chip.onclick = () => {
      wrap.remove();
      handleUserQuery(ch);
    };
    wrap.appendChild(chip);
  });
  area.appendChild(wrap);
  area.scrollTo({top:area.scrollHeight, behavior:'smooth'});
}

// ── Query Execution Pipeline ───────────────────────────────────
async function handleUserQuery(query){
  if(!query.trim()) return;
  addUserBubble(query);
  inp.value = '';

  showTyping();

  // Call live multi-turn Gemini API
  const aiResponse = await queryGemini(query);

  hideTyping();

  const localData = matchCategory(query);

  if(aiResponse){
    const extraChips = addGotiloBubble(aiResponse);
    await new Promise(r => setTimeout(r, 300));
    renderCards(localData.cards);
    await new Promise(r => setTimeout(r, 300));
    renderChips(extraChips.length > 0 ? extraChips : localData.chips);
  } else {
    // Graceful offline fallback
    addGotiloBubble(`Got it! 👍 I found verified options for <strong>${escapeHtml(query)}</strong> nearby in Ahmedabad.`);
    await new Promise(r => setTimeout(r, 300));
    renderCards(localData.cards);
    await new Promise(r => setTimeout(r, 300));
    renderChips(localData.chips);
  }
}

function handleSend(){
  const val = inp.value.trim();
  if(!val) return;
  handleUserQuery(val);
}

inp.addEventListener('keydown', e => {
  if(e.key === 'Enter') handleSend();
});

function handleChipScenario(key, el){
  document.querySelectorAll('.s-chip').forEach(c => c.classList.remove('active'));
  if(el) el.classList.add('active');
  const queries = {
    sweeper: "I need a sweeper / maid for home cleaning in Satellite",
    plumber: "My bathroom tap is leaking urgently",
    dairy: "Need 1L Amul Gold milk and fresh dahi",
    ac: "My AC needs gas filling and service",
    xerox: "Where can I get color xerox printouts",
    puncture: "Bike puncture repair doorstep",
    grocery: "Atta and besan grocery delivery"
  };
  handleUserQuery(queries[key] || key);
}

// ── Real Web Speech Voice Input ────────────────────────────────
let recognition = null;
function toggleVoiceRecognition(){
  const mic = document.getElementById('micBtn');
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRec){
    inp.placeholder = "Listening simulated...";
    showToast("Listening... (Speak your need)");
    setTimeout(() => {
      inp.value = "I need sweeper for house cleaning";
      inp.placeholder = "Tell Gotilo what you need...";
      setTimeout(() => handleSend(), 400);
    }, 1200);
    return;
  }

  if(recognition){
    recognition.stop();
    recognition = null;
    mic.classList.remove('recording');
    return;
  }

  recognition = new SpeechRec();
  recognition.lang = 'gu-IN' || 'hi-IN' || 'en-IN';
  recognition.interimResults = false;

  mic.classList.add('recording');
  inp.placeholder = "Listening... Speak now 🎙️";
  showToast("🎙️ Listening (Gujarati, Hindi, English)...");

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    inp.value = transcript;
    inp.placeholder = "Tell Gotilo what you need...";
    mic.classList.remove('recording');
    recognition = null;
    setTimeout(() => handleSend(), 300);
  };

  recognition.onerror = () => {
    mic.classList.remove('recording');
    inp.placeholder = "Tell Gotilo what you need...";
    recognition = null;
  };

  recognition.onend = () => {
    mic.classList.remove('recording');
    inp.placeholder = "Tell Gotilo what you need...";
    recognition = null;
  };

  recognition.start();
}

function clearChatHistory(){
  chatHistory = [];
  area.innerHTML = '';
  addGotiloBubble("Chat cleared! 👋 <strong>બસ કહો, ગોતીઢો.</strong><br>Tell me what you need in plain words (sweeper, plumber, milk, AC repair, xerox etc.) and I will find it nearby!");
  renderChips(["🧹 I need a sweeper", "🔧 Bathroom tap leaking", "🥛 1L Milk & Dahi", "📄 Color Xerox & Print"]);
  showToast("Chat history cleared 🧹");
}

// ── AI Key Modal ───────────────────────────────────────────────
function openApiKeyModal(){
  const saved = localStorage.getItem('gotilo_ai_key') || DEFAULT_GEMINI_KEY;
  document.getElementById('apiKeyInput').value = saved;
  document.getElementById('aiModal').classList.add('active');
}
function closeAiModal(e){
  document.getElementById('aiModal').classList.remove('active');
}
function saveApiKey(){
  const k = document.getElementById('apiKeyInput').value.trim();
  if(k){
    localStorage.setItem('gotilo_ai_key', k);
    showToast("Gemini API Key Saved! ⚡");
  } else {
    localStorage.removeItem('gotilo_ai_key');
    showToast("Using Default Gemini Key 🚀");
  }
  document.getElementById('aiModal').classList.remove('active');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ── On Page Load ───────────────────────────────────────────────

    renderChips(["🧹 I need a sweeper", "🔧 Bathroom tap leaking", "🥛 1L Milk & Dahi", "📄 Color Xerox & Print"]);
  }
});
