<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>Join Gotilo — Login &amp; Citizen Registration</title>
<meta name="application-name" content="Gotilo"/>
<meta name="theme-color" content="#FFFFFF" id="metaThemeColor"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Gujarati:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

:root, [data-theme="light"] {
  --bg-page:        #FFFFFF;
  --bg-surface:     #F8FAFC;
  --bg-card:        #FFFFFF;
  --bg-subtle:      #F1F5F9;
  --border-light:   #E2E8F0;
  --text-primary:   #0F172A;
  --text-secondary: #475569;
  --text-muted:     #94A3B8;
  --accent-saffron: #FF6B00;
  --accent-soft:    #FFF4ED;
  --logo-color:     #FF6B00;
  --shadow-sm:      0 1px 3px rgba(0,0,0,0.05);
  --shadow-md:      0 4px 14px rgba(15,23,42,0.06);
  --shadow-lg:      0 10px 30px rgba(15,23,42,0.08);
  --font-main:      'Plus Jakarta Sans', 'Noto Sans Gujarati', -apple-system, sans-serif;
}

[data-theme="dark"] {
  --bg-page:        #0B0F17;
  --bg-surface:     #111827;
  --bg-card:        #161F30;
  --bg-subtle:      #1E293B;
  --border-light:   #1E293B;
  --text-primary:   #F8FAFC;
  --text-secondary: #94A3B8;
  --text-muted:     #64748B;
  --accent-saffron: #FF6B00;
  --accent-soft:    rgba(255,107,0,0.15);
  --logo-color:     #FFFFFF;
  --shadow-sm:      0 1px 3px rgba(0,0,0,0.4);
  --shadow-md:      0 4px 16px rgba(0,0,0,0.45);
  --shadow-lg:      0 10px 30px rgba(0,0,0,0.6);
}

html,body{min-height:100%;width:100%;margin:0;padding:0;font-family:var(--font-main);background:var(--bg-page);color:var(--text-primary);-webkit-font-smoothing:antialiased;transition:background 0.25s, color 0.25s;}
.app{width:100%;max-width:480px;min-height:100vh;margin:0 auto;background:var(--bg-page);display:flex;flex-direction:column;position:relative;box-shadow:0 0 50px rgba(0,0,0,0.06);padding:20px 24px 36px;}

.top-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.back-btn{background:var(--bg-subtle);border:1px solid var(--border-light);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-primary);font-size:16px;}
.theme-btn{background:var(--bg-subtle);border:1px solid var(--border-light);border-radius:9999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--text-primary);cursor:pointer;}

.brand-section{text-align:center;margin-bottom:28px;}
.brand-title{font-size:32px;font-weight:800;letter-spacing:-0.8px;color:var(--logo-color);line-height:1;margin-bottom:4px;}
.brand-sub{font-size:13px;font-weight:700;color:var(--logo-color);margin-bottom:12px;}
.hero-tagline{font-size:14px;color:var(--text-secondary);font-weight:600;}

/* Auth Switch Tabs */
.auth-switch-tabs{display:flex;background:var(--bg-subtle);border:1px solid var(--border-light);border-radius:9999px;padding:4px;margin-bottom:24px;}
.auth-tab{flex:1;text-align:center;padding:10px;border-radius:9999px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--text-muted);transition:all 0.2s;}
.auth-tab.active{background:var(--accent-saffron);color:#fff;box-shadow:var(--shadow-sm);}

/* Forms */
.form-view{display:none;}
.form-view.active{display:block;animation:fadeIn 0.25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--text-primary);}
.input-wrap{position:relative;display:flex;align-items:center;}
.input-prefix{position:absolute;left:14px;font-size:14px;font-weight:700;color:var(--text-muted);}
.form-input{width:100%;background:var(--bg-card);border:1.5px solid var(--border-light);padding:12px 14px;border-radius:14px;font-size:14px;color:var(--text-primary);font-family:inherit;outline:none;transition:border-color 0.2s, box-shadow 0.2s;}
.form-input.has-prefix{padding-left:46px;}
.form-input:focus{border-color:var(--accent-saffron);box-shadow:0 0 0 3px rgba(255,107,0,0.12);}

.submit-btn{width:100%;background:var(--accent-saffron);border:none;border-radius:14px;padding:14px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(255,107,0,0.3);transition:transform 0.15s, opacity 0.15s;margin-top:8px;}
.submit-btn:active{transform:scale(0.98);opacity:0.9;}

.divider-row{display:flex;align-items:center;gap:12px;margin:22px 0;}
.divider-line{flex:1;height:1px;background:var(--border-light);}
.divider-text{font-size:11.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;}

.social-btn{width:100%;background:var(--bg-card);border:1.5px solid var(--border-light);border-radius:14px;padding:12px;color:var(--text-primary);font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;margin-bottom:10px;transition:background 0.15s;}
.social-btn:active{background:var(--bg-subtle);}

.extra-row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--text-secondary);margin-top:14px;}
.extra-link{color:var(--accent-saffron);font-weight:700;text-decoration:none;cursor:pointer;}

/* Citizen Role Selector */
.role-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.role-card{border:1.5px solid var(--border-light);background:var(--bg-card);border-radius:14px;padding:12px;text-align:center;cursor:pointer;transition:all 0.15s;}
.role-card.selected{border-color:var(--accent-saffron);background:var(--accent-soft);}
.role-icon{font-size:22px;margin-bottom:4px;}
.role-name{font-size:12.5px;font-weight:800;color:var(--text-primary);}
.role-desc{font-size:10.5px;color:var(--text-muted);margin-top:2px;}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);background:var(--text-primary);color:var(--bg-page);padding:10px 18px;border-radius:9999px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:all 0.3s;pointer-events:none;box-shadow:var(--shadow-lg);}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>
<div class="app">

  <nav class="top-nav">
    <button class="back-btn" onclick="window.location.href='index.html'" title="Back to Home">←</button>
    <button class="theme-btn" onclick="toggleTheme()"><span id="themeBtnText">☀️ Light</span></button>
  </nav>

  <div class="brand-section">
    <div class="brand-title">Gotilo</div>
    <div class="brand-sub">ગોતીલો</div>
    <div class="hero-tagline">City Community Skill &amp; Service Network</div>
  </div>

  <div class="auth-switch-tabs">
    <div id="tabLoginBtn" class="auth-tab active" onclick="switchAuthMode('login')">Log In</div>
    <div id="tabRegisterBtn" class="auth-tab" onclick="switchAuthMode('register')">Register as Citizen</div>
  </div>

  <!-- ── LOGIN FORM ── -->
  <div id="loginView" class="form-view active">
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Phone Number or Email</label>
        <div class="input-wrap">
          <input id="loginPhone" class="form-input" type="text" placeholder="Enter your 10-digit mobile or email" required/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password or OTP</label>
        <div class="input-wrap">
          <input id="loginPass" class="form-input" type="password" placeholder="Enter password / 6-digit OTP" required/>
        </div>
      </div>
      <div class="extra-row" style="margin-bottom:16px;">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" checked/> Remember Me
        </label>
        <span class="extra-link" onclick="showToast('OTP sent to your phone!')">Forgot Password?</span>
      </div>
      <button type="submit" class="submit-btn">Log In to Gotilo →</button>
    </form>

    <div class="divider-row">
      <div class="divider-line"></div>
      <div class="divider-text">Or Fast Login</div>
      <div class="divider-line"></div>
    </div>

    <button class="social-btn" onclick="fastOtpLogin()">
      <span>📱</span> Continue with 1-Tap Phone OTP
    </button>
    <button class="social-btn" onclick="googleLogin()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </button>
  </div>

  <!-- ── REGISTER CITIZEN FORM ── -->
  <div id="registerView" class="form-view">
    <form onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input id="regName" class="form-input" placeholder="e.g. Harsh Patel" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Mobile Number</label>
        <div class="input-wrap">
          <span class="input-prefix">+91</span>
          <input id="regPhone" class="form-input has-prefix" type="tel" placeholder="98765 43210" maxlength="10" required/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Your City Location</label>
        <select id="regCity" class="form-input" style="background:var(--bg-subtle);">
          <option value="Surat">Surat (Vesu, Adajan, Varachha, Katargam)</option>
          <option value="Ahmedabad">Ahmedabad (Satellite, Vastrapur, Bodakdev, Bopal)</option>
          <option value="Vadodara">Vadodara (Alkapuri, Gotri, Manjalpur)</option>
          <option value="Rajkot">Rajkot (Kalawad Road, Yagnik Road)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Citizen Capability Profile</label>
        <div class="role-choice-grid">
          <div class="role-card selected" onclick="selectCitizenRole(this, 'dual')">
            <div class="role-icon">⚡</div>
            <div class="role-name">Both (Offer &amp; Need)</div>
            <div class="role-desc">I offer skills and need services</div>
          </div>
          <div class="role-card" onclick="selectCitizenRole(this, 'provider')">
            <div class="role-icon">🛠️</div>
            <div class="role-name">Provider Only</div>
            <div class="role-desc">List my skill / profession</div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Your Primary Profession / Skill</label>
        <input id="regProfession" class="form-input" placeholder="e.g. Plumber, Home Chef, Tutor, Designer" required/>
      </div>

      <div class="form-group">
        <label class="form-label">Create Password</label>
        <input id="regPass" class="form-input" type="password" placeholder="At least 6 characters" required/>
      </div>

      <button type="submit" class="submit-btn">Create Citizen Profile 🚀</button>
    </form>
  </div>

</div>

<div id="toast" class="toast">Action</div>

<script>
let selectedRole = 'dual';

function selectCitizenRole(el, role){
  document.querySelectorAll('.role-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  selectedRole = role;
}

function switchAuthMode(mode){
  const loginView = document.getElementById('loginView');
  const registerView = document.getElementById('registerView');
  const tabLogin = document.getElementById('tabLoginBtn');
  const tabRegister = document.getElementById('tabRegisterBtn');

  if(mode === 'login'){
    loginView.classList.add('active');
    registerView.classList.remove('active');
    tabLogin.classList.add('active');
    tabRegister.classList.remove('active');
  } else {
    registerView.classList.add('active');
    loginView.classList.remove('active');
    tabRegister.classList.add('active');
    tabLogin.classList.remove('active');
  }
}

function handleLogin(e){
  e.preventDefault();
  const phone = document.getElementById('loginPhone').value.trim();
  const user = {
    name: 'Harsh Patel',
    phone: phone,
    city: 'Surat',
    role: 'Citizen & Tech Consultant',
    isLoggedIn: true
  };
  localStorage.setItem('gotilo_user', JSON.stringify(user));
  showToast('Welcome back, Harsh Patel! 🎉');
  setTimeout(()=>{ window.location.href = 'index.html'; }, 900);
}

function handleRegister(e){
  e.preventDefault();
  const name = document.getElementById('regName').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const city = document.getElementById('regCity').value;
  const profession = document.getElementById('regProfession').value.trim();

  const user = {
    name: name,
    phone: '+91 ' + phone,
    city: city,
    role: profession,
    type: selectedRole,
    isLoggedIn: true
  };
  localStorage.setItem('gotilo_user', JSON.stringify(user));
  showToast('Account Created! Welcome to Gotilo 🌟');
  setTimeout(()=>{ window.location.href = 'index.html'; }, 900);
}

function fastOtpLogin(){
  showToast('📱 OTP 4298 Verified! Logging in...');
  const user = {
    name: 'Harsh Patel',
    phone: '+91 98980 12345',
    city: 'Surat',
    role: 'Citizen & Consultant',
    isLoggedIn: true
  };
  localStorage.setItem('gotilo_user', JSON.stringify(user));
  setTimeout(()=>{ window.location.href = 'index.html'; }, 1000);
}

function googleLogin(){
  showToast('Google Authenticated! 🚀');
  fastOtpLogin();
}

function initTheme(){
  const saved = localStorage.getItem('gotilo_theme') || 'light';
  applyTheme(saved);
}

function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  applyTheme(next);
}

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('gotilo_theme', theme);
  const meta = document.getElementById('metaThemeColor');
  if(meta) meta.setAttribute('content', theme === 'dark' ? '#0B0F17' : '#FFFFFF');
  const btn = document.getElementById('themeBtnText');
  if(btn) btn.textContent = theme === 'dark' ? '🌙 Dark' : '☀️ Light';
}

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.classList.remove('show'); }, 2200);
}

window.addEventListener('DOMContentLoaded', initTheme);
</script>
</body>
</html>
